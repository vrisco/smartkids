name = "app"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Web Push (VAPID). La clave PÚBLICA no es secreta (va al cliente). La PRIVADA es un secreto:
#   wrangler secret put VAPID_PRIVATE_JWK   (el JWK con la componente "d")
[vars]
VAPID_PUBLIC = "BBt5nkdUbJp9PtRHuGsyJXqmAjAdCrULfJ9dOzpCO3LIM6NZ4gDiyI-U1Fw3A-FYmC7C-y6hOOz8TTuESde72-4"
VAPID_SUBJECT = "https://app.smart-kids.uk"

# Cron: engagement proactivo (resumen semanal + alerta de inactividad). El handler scheduled()
# es idempotente por día (anti-spam por digestAt/inactivityNotifiedAt), así que basta un disparo diario.
# 17:00 UTC ≈ 18-19h en España (buena hora para avisar a las familias).
[triggers]
crons = ["0 17 * * *"]

# Dominio propio: el Worker se sirve en https://app.smart-kids.uk
# Cloudflare provisiona el registro DNS de `app` y el certificado TLS automáticamente.
# (La URL app.smartkids.workers.dev sigue funcionando como respaldo.)
[[routes]]
pattern = "app.smart-kids.uk"
custom_domain = true

# La SPA (build de apps/web) se sirve como Static Assets desde el mismo Worker:
# mismo origen que la API, un solo deploy, sin CORS. Requiere `pnpm --filter @smartkids/web build`.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Base de datos D1 (SQLite serverless).
# Para DESARROLLO LOCAL no hace falta el id real: wrangler usa una D1 local en .wrangler/.
# Para producción: `pnpm --filter @smartkids/api exec wrangler d1 create smartkids`
# y pega el database_id aquí.
[[d1_databases]]
binding = "DB"
database_name = "smartkids"
database_id = "a032dbc4-2172-4312-ac1f-01fe79da7b74"
migrations_dir = "migrations"

# Almacenamiento de objetos R2: material subido por los tutores (fotos, PDF, texto) para la Vía B.
# En local, wrangler crea un R2 local en .wrangler/. Bucket creado con:
#   wrangler r2 bucket create smartkids-uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "smartkids-uploads"

# ============================================================================
# ENTORNO DE PRUEBAS (staging)
#
#   pnpm --filter @smartkids/api exec wrangler deploy --env staging
#   pnpm --filter @smartkids/api exec wrangler d1 migrations apply smartkids_staging --remote --env staging
#
# Existe para que probar deje de significar "tocar la base donde están los intentos y
# las monedas de un niño real". Diferencias deliberadas con producción:
#   - Base de datos y bucket PROPIOS: nada de lo que pase aquí toca los datos reales.
#   - SIN dominio custom (se sirve en app-staging.<subdominio>.workers.dev).
#   - SIN cron: nada de correos automáticos desde un entorno de pruebas.
#   - SIN RESEND_API_KEY: el email cae a modo simulado y JAMÁS sale un correo a una
#     familia real desde aquí. Es la razón principal de separar los entornos.
#   - EMAIL_DEV_LINKS=true: los enlaces de verificación y reset vuelven en la respuesta
#     HTTP para poder probar sin proveedor de correo. Esto NUNCA debe estar en producción.
#
# Los bindings NO se heredan del bloque de arriba: hay que declararlos enteros.
# ============================================================================
[env.staging]
name = "app-staging"
workers_dev = true
# CRÍTICO: sin esto, staging HEREDA las rutas de arriba y se lleva el dominio
# app.smart-kids.uk, dejando la app real fuera de servicio en cuanto se despliegue.
routes = []

[env.staging.vars]
EMAIL_DEV_LINKS = "true"
VAPID_PUBLIC = "BBt5nkdUbJp9PtRHuGsyJXqmAjAdCrULfJ9dOzpCO3LIM6NZ4gDiyI-U1Fw3A-FYmC7C-y6hOOz8TTuESde72-4"
VAPID_SUBJECT = "https://app-staging.workers.dev"

# Sin disparadores: el cron de engagement manda correos a familias.
[env.staging.triggers]
crons = []

[env.staging.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "smartkids_staging"
database_id = "5f51e719-8422-4d5e-8886-46ecc3044859"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "UPLOADS"
bucket_name = "smartkids-uploads-staging"
